name: Build GPU Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version tag (optional)'
        required: false
        type: string
  schedule:
    - cron: '0 6 * * 1'  # Weekly: Monday 6:00 UTC

env:
  NDK_VERSION: r27

jobs:
  build-virglrenderer:
    name: Build virglrenderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3-pip wget xz-utils
          pip3 install meson

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
          local-cache: true

      - name: Setup Termux sysroot (dependencies)
        run: |
          chmod +x ci/setup-sysroot.sh
          ./ci/setup-sysroot.sh "$PWD/.build/sysroot"
        shell: bash

      - name: Build virglrenderer
        run: |
          # Fix meson cross-file NDK path
          NDK_PATH="$ANDROID_NDK_ROOT"
          sed -i "s|/opt/android-ndk|$NDK_PATH|g" ci/aarch64-linux-android-cross.ini

          # Run build
          chmod +x ci/build-virglrenderer.sh
          SYSROOT_DIR="$PWD/.build/sysroot" \
            NDK_DIR="$NDK_PATH" \
            NINJA_JOBS=2 \
            ./ci/build-virglrenderer.sh
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: virglrenderer-pkg
          path: packages/virglrenderer*.pkg.tar.xz
          if-no-files-found: error

  build-icd-wrapper:
    name: Build mesa-vulkan-icd-wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate ICD wrapper
        run: |
          chmod +x ci/build-icd.sh
          # Since we're on x86_64 CI runner, there's no Mali driver.
          # Create a generic ICD that points to the standard Mali path.
          # The script handles this case gracefully.
          ./ci/build-icd.sh
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: icd-wrapper-pkg
          path: packages/mesa-vulkan-icd-wrapper*.pkg.tar.xz
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [build-virglrenderer, build-icd-wrapper]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate release info
        id: release_info
        run: |
          DATE=$(date -u +%Y%m%d-%H%M%S)
          echo "tag=ci-build-$DATE" >> $GITHUB_OUTPUT
          echo "name=CI Build $DATE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          body: |
            ## CI Build Packages

            - virglrenderer: built from source (freedesktop.org)
            - mesa-vulkan-icd-wrapper: auto-generated

            Install:
            ```
            pacman -U *.pkg.tar.xz
            ```

            Built: $(date -u)
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: false
