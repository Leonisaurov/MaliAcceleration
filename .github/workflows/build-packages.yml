name: Build GPU Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version tag (optional)'
        required: false
        type: string
  schedule:
    - cron: '0 6 * * 1'  # Weekly: Monday 6:00 UTC

env:
  NDK_VERSION: r27

jobs:
  build-virglrenderer:
    name: Build virglrenderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3-pip wget xz-utils
          pip3 install meson

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
          local-cache: true

      - name: Setup Termux sysroot (dependencies)
        run: |
          chmod +x ci/setup-sysroot.sh
          ./ci/setup-sysroot.sh "$PWD/.build/sysroot"
        shell: bash

      - name: Build virglrenderer
        run: |
          # Fix meson cross-file NDK path
          NDK_PATH="$ANDROID_NDK_ROOT"
          sed -i "s|/opt/android-ndk|$NDK_PATH|g" ci/aarch64-linux-android-cross.ini

          # Run build
          chmod +x ci/build-virglrenderer.sh
          SYSROOT_DIR="$PWD/.build/sysroot" \
            NDK_DIR="$NDK_PATH" \
            NINJA_JOBS=2 \
            ./ci/build-virglrenderer.sh
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: virglrenderer-pkg
          path: packages/virglrenderer*.pkg.tar.xz
          if-no-files-found: error

  build-icd-wrapper:
    name: Build mesa-vulkan-icd-wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate ICD wrapper
        run: |
          chmod +x ci/build-icd.sh
          # Since we're on x86_64 CI runner, there's no Mali driver.
          # Create a generic ICD that points to the standard Mali path.
          # The script handles this case gracefully.
          ./ci/build-icd.sh
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: icd-wrapper-pkg
          path: packages/mesa-vulkan-icd-wrapper*.pkg.tar.xz
          if-no-files-found: error

  build-angle:
    name: Build angle-android
    runs-on: ubuntu-latest
    env:
      ANGLE_COMMIT: 22ba45a57477342698df834a7b2df7a54ac0df34
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 python3-pip wget xz-utils
          pip3 install httplib2

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
          local-cache: true

      - name: Cache depot_tools
        id: cache-depot
        uses: actions/cache@v4
        with:
          path: .depot_tools
          key: depot-tools-${{ runner.os }}

      - name: Install depot_tools
        if: steps.cache-depot.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git .depot_tools

      - name: Add depot_tools to PATH
        run: echo "$PWD/.depot_tools" >> $GITHUB_PATH

      - name: Cache ANGLE source
        id: cache-angle
        uses: actions/cache@v4
        with:
          path: .angle-source
          key: angle-source-${{ env.ANGLE_COMMIT }}-${{ runner.os }}

      - name: Fetch ANGLE source
        if: steps.cache-angle.outputs.cache-hit != 'true'
        run: |
          mkdir -p .angle-source
          cd .angle-source
          gclient config --unmanaged https://chromium.googlesource.com/angle/angle
          echo 'target_os = ["android"]' >> .gclient
          gclient sync --no-history --revision ${{ env.ANGLE_COMMIT }}
          # Verify commit position
          cd angle
          echo "ANGLE commit position: $(git rev-list HEAD --count)"

      - name: Build ANGLE
        run: |
          chmod +x ci/build-angle.sh
          ANGLE_SRC_DIR="$PWD/.angle-source/angle" \
            NDK_DIR="$ANDROID_NDK_ROOT" \
            NINJA_JOBS=2 \
            ./ci/build-angle.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: angle-pkg
          path: packages/angle-android*.pkg.tar.xz
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [build-virglrenderer, build-icd-wrapper, build-angle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate release info
        id: release_info
        run: |
          DATE=$(date -u +%Y%m%d-%H%M%S)
          echo "tag=ci-build-$DATE" >> $GITHUB_OUTPUT
          echo "name=CI Build $DATE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          body: |
            ## CI Build Packages

            - virglrenderer: built from source (freedesktop.org)
            - angle-android: built from source (Google ANGLE)
            - mesa-vulkan-icd-wrapper: auto-generated

            Install:
            ```
            pacman -U *.pkg.tar.xz
            ```

            Built: $(date -u)
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: false
