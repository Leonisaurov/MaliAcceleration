[binaries]
c = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang'
cpp = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++'
ar = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
ranlib = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
strip = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
pkgconfig = '/usr/bin/pkg-config'

[built-in options]
c_std = gnu11
cpp_std = gnu++17
prefix = '/data/data/com.termux/files/usr'
libdir = '/data/data/com.termux/files/usr/lib'

[host_machine]
system = android
cpu_family = aarch64
cpu = armv8-a
endian = little

[properties]
needs_exe_wrapper = true
pkg_config_libdir = '/data/data/com.termux/files/usr/lib/pkgconfig'
